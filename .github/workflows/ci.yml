# Builds the warehouse from scratch and runs the test suite on every push and PR.
# The data is Olist's real marketing funnel, committed under data/raw and hash-checked,
# so CI needs no secrets and no Kaggle download.
# The live-Ollama agent test skips itself (RUN_OLLAMA_TESTS is not set here).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      # 3.13, not 3.14: dbt-duckdb's dependency chain has no CPython 3.14 wheels yet.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the committed Olist CSVs (SHA-256, no download)
        run: python pipelines/fetch_data.py --verify

      - name: Load into DuckDB (with integrity checks)
        run: python pipelines/load_to_duckdb.py

      - name: dbt build (models + data tests)
        run: dbt build

      - name: pytest
        run: pytest -q
