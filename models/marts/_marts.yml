version: 2

models:
  - name: fct_lead_funnel
    description: One row per marketing-qualified lead, joined to its deal if it closed.
    columns:
      - name: mql_id
        data_tests: [unique, not_null]
      - name: is_won
        data_tests: [not_null]
      - name: days_to_close
        description: First contact to close, in days. NULL for open/lost leads and the one deal dated before its first contact.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: sdr_id
        description: Only populated for won leads; the export doesn't say who worked lost leads.

  - name: agg_lead_source_conversion
    description: Conversion by lead source with 95% Wilson intervals.
    columns:
      - name: lead_source
        data_tests: [unique, not_null]
      - name: conversion_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: conversion_rate_ci_low
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: conversion_rate_ci_high
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: share_of_mqls
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_cohort_conversion
    description: Conversion by first-contact month, overall and within fixed windows.
    columns:
      - name: cohort_month
        data_tests: [unique, not_null]
      - name: conversion_rate_to_date
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: conversion_rate_90d
        description: NULL until every lead in the cohort is at least 90 days old.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_segment_summary
    description: Won deals by the seller's business segment.
    columns:
      - name: business_segment
        data_tests: [unique, not_null]
      - name: share_of_deals
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: dim_sdrs
    description: One row per SDR, from won deals only (volume and speed, not conversion).
    columns:
      - name: sdr_id
        data_tests: [unique, not_null]
      - name: sdr_label
        data_tests: [unique, not_null]
      - name: share_closed_within_30_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: dim_sales_reps
    description: One row per sales rep (closer), from won deals only.
    columns:
      - name: sr_id
        data_tests: [unique, not_null]
      - name: sales_rep_label
        data_tests: [unique, not_null]
      - name: share_closed_within_30_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_landing_page_conversion
    description: Conversion per landing page with at least vars.min_landing_page_mqls leads.
    columns:
      - name: landing_page_id
        data_tests: [unique, not_null]
      - name: conversion_rate
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: dim_date
    description: Calendar from the first lead to the as-of date.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
