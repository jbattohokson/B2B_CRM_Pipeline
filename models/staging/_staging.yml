version: 2

models:
  - name: stg_mqls
    description: One row per marketing-qualified lead, with a cohort month and a cleaned lead source.
    columns:
      - name: mql_id
        data_tests: [unique, not_null]
      - name: first_contact_date
        data_tests: [not_null]
      - name: lead_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic_search', 'paid_search', 'social', 'unknown', 'direct_traffic', 'email',
                         'referral', 'other', 'display', 'other_publicities']

  - name: stg_closed_deals
    description: One row per won lead (a signed seller).
    columns:
      - name: mql_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mqls')
                field: mql_id
      - name: seller_id
        data_tests: [unique, not_null]
      - name: sdr_id
        data_tests: [not_null]
      - name: sr_id
        data_tests: [not_null]
      - name: declared_monthly_revenue_brl
        description: Self-declared monthly revenue in BRL; NULL when the seller declared none.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.01
