name: b2b_crm_pipeline
version: "2.0.0"
config-version: 2
profile: b2b_crm_pipeline

model-paths: ["models"]
macro-paths: ["macros"]
# Singular dbt tests live in data_tests/ so they don't collide with the pytest suite in tests/.
test-paths: ["data_tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # "Today" for every as-of metric: the last close date in the published Olist export.
  as_of_date: "2018-11-14"
  # Landing pages with fewer MQLs than this are too small to compare conversion rates.
  min_landing_page_mqls: 30

models:
  b2b_crm_pipeline:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
